<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>إدارة Ommi Food</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-page">
  <main class="admin-shell">
    <section id="adminLogin" class="admin-login-card">
      <div class="logo admin-logo">Ommi Food</div>
      <h1>لوحة الإدارة</h1>
      <p>دخول الإدارة فقط</p>
      <input id="adminEmail" class="field" type="email" autocomplete="username" placeholder="البريد الإلكتروني" />
      <input id="adminPassword" class="field" type="password" autocomplete="current-password" placeholder="كلمة المرور" />
      <button id="adminLoginBtn" class="primary full">دخول</button>
      <div id="adminLoginError" class="admin-error" aria-live="polite"></div>
    </section>

    <section id="adminDashboard" class="admin-dashboard" hidden>
      <header class="admin-header">
        <div><strong>إدارة Ommi Food</strong><span id="adminIdentity"></span></div>
        <button id="adminLogoutBtn" class="admin-secondary">تسجيل الخروج</button>
      </header>
      <div class="admin-summary">
        <div><strong id="pendingCount">0</strong><span>طلبات قيد المراجعة</span></div>
        <div><strong id="activeCount">0</strong><span>عضويات مفعلة</span></div>
      </div>
      <div class="admin-section-head">
        <h2>الطاهيات والطهاة</h2>
        <button id="adminRefreshBtn" class="admin-secondary">تحديث</button>
      </div>
      <div id="adminChefList" class="admin-chef-list"></div>
    </section>
  </main>
  <div id="toast" class="toast"></div>
  <script src="admin.js"></script>
</body>
</html>
